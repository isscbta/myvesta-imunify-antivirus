; ImunifyAV stand-alone integration for myVesta.
; Copied to /etc/sysconfig/imunify360/integration.conf by imav-install.sh
; BEFORE the ImunifyAV installer runs (ui_path and panel_info are mandatory).
;
; The web UI is not served; ui_path points to an empty directory.
; The integration scripts give ImunifyAV the panel name and version and the
; list of myVesta users and their web domains, so that findings are
; attributed to the right user and "imunify-antivirus infected-domains" works.

[paths]
ui_path = /opt/imunifyav-ui

[integration_scripts]
panel_info = /usr/local/vesta/bin/v-imav-panel-info-integration
users = /usr/local/vesta/bin/v-imav-list-users-integration
domains = /usr/local/vesta/bin/v-imav-list-domains-integration
